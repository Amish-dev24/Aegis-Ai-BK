[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show extra test summary info for failures, errors and warnings
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

markers =
    slow: marks tests as slow (deselect with -m "not slow")
    integration: marks tests that require a running DB/server
