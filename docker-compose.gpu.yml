version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# Aegis AI — GPU compose (GCP VM: n1-standard-4 + NVIDIA Tesla P100)
#
# Database: AWS RDS PostgreSQL — set DATABASE_URL in your .env file
# Redis:    local container
#
# Prerequisites on the VM (one-time):
#   sudo apt-get install -y nvidia-container-toolkit
#   sudo systemctl restart docker
#
# Usage:
#   docker compose -f docker-compose.gpu.yml up -d
#   Or:  ./deploy.sh [commit-id]    ← auto-uses this file on GPU VMs
# ─────────────────────────────────────────────────────────────────────────────

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.gpu
      args:
        COMMIT_ID: ${COMMIT_ID:-unknown}
    image: aegis-bk-gpu:${COMMIT_ID:-latest}
    restart: unless-stopped
    # ── Tesla P100: expose GPU to this container ──────────────────────────────
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./uploads:/app/uploads
      - ./evidence:/app/evidence
      - ./processed_videos:/app/processed_videos
      - ./models:/app/models
    ports:
      - "8000:8000"
    env_file:
      - .env                          # DATABASE_URL from .env → points to AWS RDS
    environment:
      REDIS_URL: redis://redis:6379/0
      ONNX_PREFER_GPU: "true"
      TORCH_PREFER_GPU: "true"
      CUDA_VISIBLE_DEVICES: "0"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# NOTE: No local postgres service — using AWS RDS.
