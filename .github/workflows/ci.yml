name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging]

# Cancel any in-progress run on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.4.4

      - name: Run ruff check
        run: ruff check app/ tests/ --output-format=github

      - name: Run ruff format check
        run: ruff format --check app/ tests/

  # ── Job 2: Test ─────────────────────────────────────────────────────────────
  test:
    name: Test (pytest + SQLite)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Install PyTorch CPU-only wheel first — much smaller than the CUDA build
      # and cached between runs via actions/setup-python cache.
      - name: Install PyTorch (CPU-only)
        run: |
          pip install torch torchvision torchaudio \
            --index-url https://download.pytorch.org/whl/cpu

      # Install main project dependencies (ultralytics, opencv, fastapi, etc.)
      - name: Install project dependencies
        run: pip install -r requirements.txt

      # Install test tooling (not in requirements.txt to keep production image lean)
      - name: Install test tooling
        run: pip install pytest pytest-cov

      # Create required directories (config.py mkdir calls these on import)
      - name: Prepare runtime directories
        run: mkdir -p uploads evidence processed_videos models

      - name: Run tests
        env:
          DATABASE_URL: "sqlite:///./test_aegis.db"
          SECRET_KEY: "ci-test-secret-key-aegis-fyp"
          ENVIRONMENT: "test"
          DATA_RETENTION_DAYS: "0"
          WEAPON_MODEL_PATH: "./models/fake_weapon_v1.pt"
          MODEL_PATH: "./models/fake_bag_box.pt"
          FACE_MODEL_PATH: "./models/fake_face.pt"
          CROWD_MODEL_PATH: "./models/fake_crowd.onnx"
          VIOLENCE_MODEL_PT_PATH: "./models/fake_violence.pt"
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          flags: backend
          name: aegis-ai-backend
        continue-on-error: true   # don't fail CI if Codecov is unavailable

  # ── Job 3: Docker build ──────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: aegis-ai-bk:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
